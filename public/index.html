<!doctype html>
<html lang="zh-CN" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="TG-RSS — Telegram 频道阅读器" />
    <title>TG-RSS</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23229ED9'/%3E%3Cpath d='M14 32l36-14-6 30-10-8-6 6-1-10z' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="alternate" type="application/rss+xml" title="TG-RSS" href="/rss.xml" />
  </head>
  <body>
    <header class="topbar">
      <button id="sidebar-toggle" class="iconbtn" aria-label="频道列表" title="频道列表">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </button>
      <a class="brand" href="#/"><span class="brand-mark"></span><span id="site-title">TG-RSS</span></a>
      <nav class="nav" id="main-nav">
        <a href="#/" data-nav="feed">信息流</a>
        <a href="#/media" data-nav="media">媒体</a>
        <a href="#/admin" data-nav="admin" id="nav-admin">管理</a>
      </nav>
      <div class="topbar-right">
        <span id="auth-badge" class="badge" hidden>管理员</span>
        <button id="theme-toggle" class="iconbtn" aria-label="切换主题" title="切换主题">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 109 9c0-.5 0-1-.1-1.4A7 7 0 0112 3z"/></svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head">
          <span>频道</span>
          <button class="linkbtn" id="refresh-all" title="刷新频道列表">刷新</button>
        </div>
        <ul class="channel-list" id="channel-list">
          <li class="muted">加载中…</li>
        </ul>
        <div class="sidebar-foot">
          <a href="#/media" class="sidebar-link">媒体模式</a>
          <a href="#/admin" class="sidebar-link">管理后台</a>
          <a href="/rss.xml" target="_blank" rel="noopener" class="sidebar-link">RSS 订阅</a>
        </div>
      </aside>
      <div class="sidebar-mask" id="sidebar-mask" hidden></div>

      <main class="app" id="app" tabindex="-1">
        <div class="loading">加载中…</div>
      </main>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>
    <div class="lightbox" id="lightbox" hidden></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
